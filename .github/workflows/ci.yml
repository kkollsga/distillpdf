name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  msrv:
    name: Rust MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88.0

      - name: Check the complete workspace on the declared MSRV
        run: cargo check --workspace --all-targets

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive   # third_party/{leptonica,tesseract} for the bundled fast OCR engine

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'distillpdf/Cargo.toml', 'distillpdf-python/Cargo.toml') }}

      - name: Rust unit tests
        # Scope to the pyo3-free core: a bare `cargo test --lib` at the workspace root would
        # also build distillpdf-python's lib tests, which need libpython linked. `-p distillpdf`
        # runs only the core's pure-logic unit tests (it carries no pyo3).
        run: cargo test -p distillpdf --lib

      - name: Build & install distillpdf (with the bundled Tesseract fast OCR engine)
        # `--features extension-module,tesseract` builds minimal static Leptonica + Tesseract from the vendored
        # submodules (CMake is preinstalled on the runner), exercising the same path the wheels
        # use and enabling the bundled-engine tests.
        run: |
          python -m pip install --upgrade pip maturin pytest
          maturin build --release --features extension-module,tesseract --out dist
          pip install dist/*.whl

      - name: Fixture drift
        # The committed fixtures must be exactly what tests/gen_*.py produce: the suite
        # asserts against the committed BYTES, so a generator that has drifted leaves
        # tests guarding a file nothing can reproduce (which is how panel_table.pdf and
        # five orphaned corpus_tables negatives were found). Regenerates into a temp copy
        # at a different path — a generator that leaks its checkout directory into the PDF
        # fails here and would pass an in-place rerun.
        run: |
          python -m pip install -r tests/requirements-dev.txt
          PYTHON=python ./scripts/check-fixture-drift.sh

      - name: Run tests
        # tests/ is fully self-contained: every fixture is generated by us and committed
        # (no third-party corpus), so the whole suite runs for real on a fresh clone.
        #
        # This includes tests/test_table_corpus.py — the CELL-TRUTH table gate over the
        # committed table torture corpus. It exists because both older table metrics are
        # blind to cell PLACEMENT: bench100's score is count + rows x cols (it reads 1.0 when
        # every value sits under the wrong header) and tests/test_tables.py's cell recall is
        # a token SET. The torture corpus knows every cell's (r, c) by construction, so
        # positional accuracy and header attribution are gateable here, in CI, on every push
        # — which is exactly what a licence-encumbered local corpus can never be. Its
        # source-fidelity parity gate needs real PDFs and therefore runs in
        # scripts/release-check.sh instead.
        #
        # The deeper corpus regression gate (37 metrics over 25+ real-world PDFs) is NOT
        # run here ON PURPOSE: the corpus is license-encumbered third-party material and
        # cannot be published, so the whole benchmarking/ tree is gitignored and exists
        # only on a maintainer's machine. Faking a CI job that silently skips when the
        # corpus is absent would read as "covered" when it isn't. Instead the gate is a
        # required LOCAL pre-release step — run scripts/release-check.sh (it runs these
        # same checks plus the corpus gate). Treat a green release-check, not this badge,
        # as the release gate.
        run: pytest tests/ -q
