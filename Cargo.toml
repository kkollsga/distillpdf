# Virtual workspace: the pyo3-free core (`distillpdf`) + the PyO3 wheel (`distillpdf-python`).
# One version, bumped in lockstep via `[workspace.package]`, ships both crates.
[workspace]
members = ["distillpdf", "distillpdf-python"]
resolver = "2"

[workspace.package]
# Keep `version` the FIRST key here: publish.yml greps `^version` off this file to gate the
# PyPI release, and both member crates inherit it via `version.workspace = true`.
version = "0.1.4"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/kkollsga/distillpdf"
homepage = "https://github.com/kkollsga/distillpdf"

[workspace.dependencies]
# PyO3 is declared once and opted into ONLY by `distillpdf-python`, so the core crate (and any
# Rust embedder of it, e.g. kglite) never drags pyo3 into its dependency tree.
pyo3 = { version = "0.25", features = ["abi3-py38"] }

# The release profile MUST live at the workspace root — cargo IGNORES `[profile.*]` declared in
# a member crate. These are the exact settings the wheel has always shipped with.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
